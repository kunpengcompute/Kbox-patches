# ******************************************************************************** #
# Kbox Android 11 构建配置文件
# 说明: 修改以下配置项以适应您的构建环境
# ******************************************************************************** #

# AOSP 源码目录路径
# 请确保该目录存在且有足够的磁盘空间（建议至少 200GB）
AOSP_PATH="/home/auto_compile/aosp"

# 依赖包目录路径
# 该目录应包含 meson、mesa、llvm、libdrm、libva 等依赖包
# 以及 BoostKit-boostcph-kbox_*.zip 二进制软件包
PACKAGE_PATH="/home/auto_compile/Kbox-patches-AOSP11/make_img_sample/kbox11_android_build/package"

# Kbox 源码目录路径
# 该目录应包含 Kbox 源码
# 当USE_PREBUILT不为1或PACK_BINARY不为0时必须正确配置
KBOX_SRC_PATH="/home/auto_compile/Kbox"

# DNS 服务器地址
# 用于 Android 镜像的网络配置
DNS="114.114.114.114"

# 是否使用预编译包
# 1: 使用预编译包 0: 不使用预编译包
# 注意: USE_PREBUILT 与 PACK_BINARY 互斥, 不允许同时为 1
USE_PREBUILT=0

# 是否生成二进制包
# 1: 生成二进制包 0: 不生成二进制包
# 注意: USE_PREBUILT 与 PACK_BINARY 互斥, 不允许同时为 1
PACK_BINARY=0

# 是否编译软渲染镜像
# 1: 编译软渲染镜像 0: 编译硬渲染镜像(默认)
ENABLE_SOFT_RENDER=0

# 验证必需配置项的公共函数
validate_config() {
    local missing_configs=()
    
    [ -z "${AOSP_PATH:-}" ] && missing_configs+=("AOSP_PATH")
    [ -z "${PACKAGE_PATH:-}" ] && missing_configs+=("PACKAGE_PATH")
    [ -z "${KBOX_SRC_PATH:-}" ] && missing_configs+=("KBOX_SRC_PATH")
    [ -z "${DNS:-}" ] && missing_configs+=("DNS")
    [ -z "${USE_PREBUILT:-}" ] && missing_configs+=("USE_PREBUILT")
    [ -z "${PACK_BINARY:-}" ] && missing_configs+=("PACK_BINARY")
    [ -z "${ENABLE_SOFT_RENDER:-}" ] && missing_configs+=("ENABLE_SOFT_RENDER")   

    if [ ${#missing_configs[@]} -ne 0 ]; then
        echo "错误: 以下配置项未设置: ${missing_configs[*]}"
        return 1
    fi

    # USE_PREBUILT 与 PACK_BINARY 互斥检查
    if [ "${USE_PREBUILT}" = "1" ] && [ "${PACK_BINARY}" = "1" ]; then
        echo "错误: USE_PREBUILT 与 PACK_BINARY 不允许同时为 1, 请修改 build.conf"
        return 1
    fi

    return 0
}