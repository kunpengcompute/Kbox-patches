# AOSP 源码目录路径
# 请确保该目录存在且有足够的磁盘空间（建议至少 200GB）
AOSP_PATH="/home/kbox15-compile/aosp15"

# 依赖包目录路径
# 该目录应包含 meson、mesa 等依赖包
# 以及 BoostKit-boostcph-kbox_*.zip 二进制软件包
PACKAGE_PATH="/home/kbox15-compile/packages"

# Kbox 源码目录路径
# 该目录应包含 Kbox 源码
# 当USE_PREBUILT不为1时必须正确配置
KBOX_SRC_PATH="/home/kbox15-compile/Kbox"

# Kbox 补丁目录路径
# 该目录应包含 Kbox 补丁仓源码
KBOX_PATCHES_PATH="/home/kbox15-compile/Kbox-patches"

# DNS 服务器地址
# 用于 Android 镜像的网络配置
DNS="114.114.114.114"

# 是否使用预编译包
# 1: 使用预编译包 0: 不使用预编译包
USE_PREBUILT=0

# 是否生成二进制包
# 1: 生成二进制包 0: 不生成二进制包
PACK_BINARY=0

PATCH_PATH="$KBOX_PATCHES_PATH/patchForAndroid15"

# 验证必需配置项的公共函数
validate_config() {
    local missing_configs=()
    
    [ -z "${AOSP_PATH:-}" ] && missing_configs+=("AOSP_PATH")
    [ -z "${PACKAGE_PATH:-}" ] && missing_configs+=("PACKAGE_PATH")
    [ -z "${DNS:-}" ] && missing_configs+=("DNS")
    [ -z "${USE_PREBUILT:-}" ] && missing_configs+=("USE_PREBUILT")
    [ -z "${PACK_BINARY:-}" ] && missing_configs+=("PACK_BINARY")
    [ -z "${KBOX_SRC_PATH:-}" ] && missing_configs+=("KBOX_SRC_PATH")
    
    if [ ${#missing_configs[@]} -ne 0 ]; then
        echo "错误: 以下配置项未设置: ${missing_configs[*]}"
        return 1
    fi
    
    return 0
}
