# ===== 路径配置（相对脚本所在目录，与当前目录结构一致）=====
# 脚本自身所在目录（build/），作为其余相对路径的基准
SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
# 工作区根目录（build/ 的上上级目录），其余路径均基于此展开
WORKSPACE="$(cd "$SCRIPT_DIR/../.." && pwd)"
# AOSP Android 14 源码目录，编译与 patch 的目标工作区
AOSP="$WORKSPACE/aosp-14"
# runtime 目录，存放运行时组件源码（如 envd）
RUNTIME="$WORKSPACE/runtime"
# redroid 补丁包所在目录，打包前应用补丁时引用
PATCH_DIR="$SCRIPT_DIR/../patchForRedroid"
# envd 组件源码路径（注入前拷贝的源）
ENVD_SRC="$RUNTIME/packages/envd"
# envd 拷贝注入到 AOSP 的目标路径
ENVD_DST="$AOSP/vendor/redroid/envd/envd"
# 编译产品名，对应 AOSP 的 product 配置
PRODUCT="redroid_arm64_only"
# lunch target，指定编译目标组合（产品-分支-类型）；如需编译 userdebug 镜像改为 redroid_arm64_only-trunk_staging-userdebug
LUNCH_TARGET="redroid_arm64_only-trunk_staging-user"
# 打包产出的 Docker 镜像标签
TAG="redroid:14.0.0_r75_arm64_only"
# 镜像打包输出的 tar 包路径（供 docker load / 导入使用）
OUT_TAR="$AOSP/redroid-14.0.0_r75_arm64_only-cubesandbox.tar"
# AOSP 编译产物目录，打包时从中取 rootfs/system 等
PROD_DIR="$AOSP/out/target/product/$PRODUCT"
# envd 编译相关，Go 模块代理地址（可被外部环境变量 GOPROXY 覆盖）
ENVD_GOPROXY="https://goproxy.cn,direct"
# GMS 统一维护脚本（下载源清单 / 载荷下载校验 / 注入参数均由其管理）
GMS_SCRIPT="$SCRIPT_DIR/pack_gms.sh"
# 是否打包包含 GMS 载荷的镜像：1 = 打包时注入 GMS；0 = 不含 GMS（默认）
ENABLE_GMS=0
