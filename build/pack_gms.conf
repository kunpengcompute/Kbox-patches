# =============================================================================
# pack_gms.conf —— GMS 下载源配置
#
# 本文件是 pack_gms.sh 的下载源唯一事实来源（ZIP_URL / ZIP_SHA256 /
# ZIP_MIRRORS），脚本启动时自动 source 本文件。文件包含第三方下载链接，
# 当前随库提交分发。
#
# 用法：
#   保持本文件与 pack_gms.sh 同目录即可（脚本默认读取 <脚本目录>/pack_gms.conf）；
#   或设置环境变量 GMS_CONFIG_FILE 指定其他配置文件路径。
# =============================================================================

# 官方来源: MindTheGapps 14.0.0 arm64 —— GitHub Releases（Android 14 官方 GApps 包）
#           主页 https://mindthegapps.com/   仓库 https://github.com/MindTheGapps/14.0.0-arm64
ZIP_URL="https://github.com/MindTheGapps/14.0.0-arm64/releases/download/MindTheGapps-14.0.0-arm64-20250203_200051/MindTheGapps-14.0.0-arm64-20250203_200051.zip"
ZIP_SHA256="6e1c3616862ce5b33e2b96074f86ae846eb1351a26a980e1ed140f8a7e7a4fd6"

# GitHub 直连慢时的公共镜像回退（内容一致性由 ZIP_SHA256 校验兜底，镜像不可信无影响）
ZIP_MIRRORS=(
    "https://gh-proxy.com/"
    "https://hub.gitmirror.com/"
    "https://ghfast.top/"
)

# -----------------------------------------------------------------------------
# 本地 / 下载来源开关
#   GMS_LOCAL=1 → 本地模式：用本机现成的 GMS 文件打包，不联网下载。
#                 GMS_LOCAL_DIR 与 GMS_ZIP_FILE 二选一（都填时优先 GMS_LOCAL_DIR）；
#                 校验不通过即报错终止，绝不回退到下载。
#   GMS_LOCAL=0 → 下载模式（默认）：用上面的 ZIP_URL 下载链接获取 GMS。
# 三个变量均可在命令行以同名环境变量覆盖（如 GMS_LOCAL=1 sudo bash build_redroid.sh pack）。
# -----------------------------------------------------------------------------
GMS_LOCAL=0
# 本地已还原的 GMS 载荷根目录（含 3 APK + 2 XML，结构与 <工作区>/gms-payload 一致）
GMS_LOCAL_DIR="${GMS_LOCAL_DIR:-}"
# 本地已下载好的 GMS zip 文件路径（须与 ZIP_SHA256 匹配）
GMS_ZIP_FILE="${GMS_ZIP_FILE:-}"

# -----------------------------------------------------------------------------
# GMS 注入开关（是否把 GMS 注入 redroid 镜像）
#   GMS_SKIP=0 → 开（默认）：编译 redroid 后注入 GMS
#   GMS_SKIP=1 → 关：编译 redroid 后不注入 GMS（产出无 GMS 基础镜像，
#                后续可按需用 deploy/inject_gms.sh 补入）
# 可用环境变量 GMS_SKIP 覆盖（如 GMS_SKIP=1 sudo bash build_redroid.sh pack）。
# -----------------------------------------------------------------------------
GMS_SKIP=0
