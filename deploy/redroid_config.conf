# =============================================================================
# redroid_config.conf —— CubeSandbox 模板/沙箱创建参数配置（bash 键值格式）
#
# 本文件供 redroid_operation.sh 读取（默认随脚本同目录，可用 --config <文件>
# 或环境变量 REDROID_CONFIG 指定其他路径）。分两段：
#   TPL_*  —— template-create 的默认参数
#   SBX_*  —— 启动沙箱的 multirun 请求体（模板/快照 ID 由脚本运行时注入）
# 键缺省时取脚本内置默认值（见 guide/user_guide.md §4.2）。
# =============================================================================

# -------------------------------- template 段 --------------------------------
# 缺省镜像（registry 全名，必须带 127.0.0.1:5000/ 前缀；命令行 --image 可覆盖）
TPL_IMAGE="127.0.0.1:5000/redroid:14.0.0_r75_arm64_only"
TPL_CPU=4000                  # CPU（millicores），模板与沙箱规格须一致
TPL_MEMORY=8192               # 内存（MB）
TPL_WRITABLE_LAYER_SIZE="10Gi"
TPL_PROBE=49983               # envd 探活端口
TPL_PROBE_TIMEOUT_MS=180000   # 探活超时（Android 冷启动约 32–49s，勿用默认 30s）
# 创建模板时携带的注解（--annotation k=v）；cube.vm.cgroup.unified_hierarchy
# 缺失时脚本自动补 false（勿改为其他值，否则沙箱进入重启循环）
TPL_ANNOTATIONS=(
    "cube.vm.cgroup.unified_hierarchy=false"
)
# redroid 显示参数（--arg k=v），构建时固化进模板
TPL_REDROID_ARGS=(
    "androidboot.redroid_width=720"
    "androidboot.redroid_height=1280"
    "androidboot.redroid_dpi=240"
    "androidboot.redroid_fps=60"
)

# -------------------------------- sandbox 段 --------------------------------
# 即 cubemastercli multirun 的请求体字段
SBX_INSTANCE_TYPE="cubebox"
SBX_NETWORK_TYPE="tap"
SBX_NAMESPACE="default"
# 模板/快照 ID 由脚本运行时注入（--alias/--snapshot 传入后写入 annotations 与
# labels 的 cube.master.appsnapshot.template.id 键）。SBX_SOURCE_ID 留空即可；
# 非空时作为未显式传 ID 情况下的后备取值。
SBX_SOURCE_ID=""
SBX_ANNOTATIONS=(
    "cube.master.appsnapshot.template.id=tpl-c78f09daaea749aeb814367e"
    "cube.master.appsnapshot.template.version=v2"
    "cube.master.appsnapshot.version=v2"
    "cube.vm.cgroup.unified_hierarchy=false"
)
SBX_LABELS=(
    "X-Caller=mastercli"
    "cube.master.appsnapshot.template.id=tpl-c78f09daaea749aeb814367e"
    "cube.master.instance.type=cubebox"
)
